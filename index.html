<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>V-Tube — Search · Learn · Solve</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <meta name="description" content="V-Tube — problem-focused video solutions. No fluff. High clarity." />

  <style>
    :root{
      --bg-1:#070707;
      --bg-2:#0f0f0f;
      --accent:#FF9933;
      --accent-2:#FF7A00;
      --muted:rgba(255,255,255,.72);
      --card-border:rgba(255,153,51,.08);
      --radius:18px;
    }

    html,body{height:100%}
    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      background:
        radial-gradient(1200px 600px at 10% 10%, rgba(255,153,51,.02), transparent 8%),
        linear-gradient(180deg,var(--bg-1),var(--bg-2));
      color:#fff;
      padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 90px);
      display:flex;
      justify-content:center;
      -webkit-font-smoothing:antialiased;
    }

    .shell{
      width:100%;
      max-width:920px;
      display:flex;
      flex-direction:column;
      gap:18px;
      margin-top:12px;
    }

    header.brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .logo-wrap{
      width:64px;
      height:64px;
      border-radius:14px;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 8px 30px rgba(255,153,51,.1);
    }

    .logo-wrap .V{
      font-size:28px;
      font-weight:800;
      color:#0b0b0b;
      letter-spacing:-1px;
    }

    .brand-text .title{
      font-size:20px;
      font-weight:800;
      letter-spacing:-.6px;
    }

    .brand-text .sub{
      font-size:12px;
      color:var(--muted);
      margin-top:2px;
    }

    main.card{
      background:linear-gradient(180deg, rgba(255,153,51,.02), rgba(255,153,51,.01));
      border-radius:var(--radius);
      padding:20px;
      border:1px solid var(--card-border);
      box-shadow:0 18px 50px rgba(0,0,0,.6);
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .search{
      display:flex;
      gap:12px;
      align-items:center;
    }

    .input-wrap{
      flex:1;
      display:flex;
      align-items:center;
      background:rgba(255,255,255,.02);
      border-radius:100px;
      padding:10px 14px;
      border:1px solid rgba(255,153,51,.08);
      transition:.25s ease;
    }

    .input-wrap:focus-within{
      box-shadow:0 18px 40px rgba(255,153,51,.15);
      transform:translateY(-2px);
      border-color:rgba(255,153,51,.18);
    }

    .search input{
      width:100%;
      background:transparent;
      border:0;
      color:#fff;
      font-size:16px;
      padding:10px;
      outline:none;
    }

    .search .cta{
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      border:0;
      color:#050505;
      padding:12px 20px;
      border-radius:999px;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 10px 30px rgba(255,153,51,.2);
    }

    .chips{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .chip{
      padding:8px 14px;
      border-radius:999px;
      background:rgba(255,153,51,.05);
      border:1px solid rgba(255,153,51,.08);
      color:var(--muted);
      font-size:13px;
      cursor:pointer;
    }

    .value{
      text-align:center;
      font-size:13px;
      color:var(--muted);
      margin-top:4px;
    }

    .bottom-toolbar{
      position:fixed;
      left:0;
      right:0;
      bottom:env(safe-area-inset-bottom);
      display:flex;
      justify-content:center;
      padding:12px;
    }

    .toolbar-inner{
      width:calc(100% - 32px);
      max-width:920px;
      background:linear-gradient(90deg, rgba(255,153,51,.03), rgba(255,153,51,.01));
      border-radius:14px;
      padding:10px 12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border:1px solid var(--card-border);
      box-shadow:0 18px 50px rgba(0,0,0,.55);
    }

    .toolbar-inner button{
      background:transparent;
      border:0;
      color:var(--accent);
      font-weight:700;
      padding:10px 14px;
      cursor:pointer;
    }

    @media(min-width:700px){
      .brand-text .title{font-size:26px}
      .logo-wrap{width:80px;height:80px}
      .search input{font-size:18px}
    }
  </style>
</head>

<body>
  <div class="shell">
    <header class="brand">
      <div class="logo-wrap"><div class="V">V</div></div>
      <div class="brand-text">
        <div class="title">V-Tube</div>
        <div class="sub">Search · Learn · Solve — one problem per video</div>
      </div>
    </header>

    <main class="card">
      <div class="search">
        <div class="input-wrap">
          <input id="q" type="search" placeholder="Type your doubt, problem or concept…" />
        </div>
        <button class="cta" id="go">Search</button>
      </div>

      <div class="chips">
        <div class="chip" data-q="Quadratic equations step by step">Quadratic equations</div>
        <div class="chip" data-q="Organic chemistry mechanisms">Organic chemistry</div>
        <div class="chip" data-q="Physics numerical problems">Physics numericals</div>
      </div>

      <div class="value">Value over views. Clarity over clickbait.</div>
    </main>
  </div>

  <div class="bottom-toolbar">
    <div class="toolbar-inner">
      <div>
        <button id="installBtn">Install</button>
        <button id="requestBtn">Request</button>
      </div>
      <div style="font-size:13px;color:var(--muted)">Tap to start learning</div>
    </div>
  </div>

  <script>
    const input = document.getElementById('q');
    const go = document.getElementById('go');

    function doSearch(q){
      q = (q || '').trim();
      if(!q){ input.focus(); return; }
      alert('Search: ' + q);
    }

    go.onclick = () => doSearch(input.value);
    input.onkeydown = e => e.key === 'Enter' && doSearch(input.value);

    document.querySelectorAll('.chip').forEach(c=>{
      c.onclick=()=>{input.value=c.dataset.q;input.focus();}
    });

    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    }

    let deferredPrompt;
    const installBtn=document.getElementById('installBtn');
    installBtn.style.display='none';

    window.addEventListener('beforeinstallprompt',e=>{
      e.preventDefault();
      deferredPrompt=e;
      installBtn.style.display='inline-block';
    });

    installBtn.onclick=async()=>{
      if(!deferredPrompt)return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt=null;
      installBtn.style.display='none';
    };

    document.getElementById('requestBtn').onclick=()=>{
      alert('Request flow coming soon.');
    };
  </script>
</body>
</html>
